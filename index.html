    <!-- Tema ilk çizimden önce uygulanır: açılışta beyaz parlama ve iPhone'da ekran kenarlarında açık bant olmaz. -->
    <style>html{background:#fbfbfa}html.dark{background:#0d0e12}</style>
    <script>
      (function () {
        // Kayıtlı tema yoksa cihazın ayarı (settingsStore ile aynı kural)
        var dark = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        try {
          var saved = JSON.parse(localStorage.getItem("taskrack-settings") || "{}");
          if (saved.state && (saved.state.theme === "light" || saved.state.theme === "dark")) dark = saved.state.theme === "dark";
        } catch (e) {}
        document.documentElement.classList.toggle("dark", dark);
        if (!dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#fbfbfa");
      })();
    </script>
