<html lang="tr">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="apple-mobile-web-app-title" content="TaskRack" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0B1220" />
    <title>TaskRack</title>
    <!-- Tema ilk çizimden önce uygulanır: açılışta beyaz parlama ve iPhone'da ekran kenarlarında açık bant olmaz. -->
    <style>html{background:#f7f5f0}html.dark{background:#0b1220}</style>
    <script>
      (function () {
        var dark = true;
        try {
          var saved = JSON.parse(localStorage.getItem("taskrack-settings") || "{}");
          dark = !(saved.state && saved.state.theme === "light");
        } catch (e) {}
        document.documentElement.classList.toggle("dark", dark);
        if (!dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f7f5f0");
      })();
    </script>
    <script type="module" crossorigin src="/taskrack-releases/assets/index-Dxf5WKcr.js"></script>
